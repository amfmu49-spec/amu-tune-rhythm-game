<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script>
        window.addEventListener('error', function(e) {
            var div = document.createElement('div');
            div.style.position = 'fixed';
            div.style.top = '0';
            div.style.left = '0';
            div.style.width = '100%';
            div.style.background = 'red';
            div.style.color = 'white';
            div.style.zIndex = '999999';
            div.style.padding = '10px';
            div.style.fontSize = '12px';
            div.style.wordBreak = 'break-all';
            div.innerHTML = '<strong>Error:</strong> ' + e.message + ' <br>at ' + e.filename + ':' + e.lineno;
            document.body.appendChild(div);
        });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AMU TUNE - Suno AI Music Experience (Rhythm Game)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css?v=1.9.6">
</head>
<body>

    <!-- スマホ縦画面 9:16 コンテナ -->
    <div class="app-container">

        <!-- 1. 最上部ヘッダー (ブランドロゴ / ステータス / ホームボタン / 設定 / バージョン表記) -->
        <header class="top-header">
            <div class="header-left" style="display: flex; gap: 6px; align-items: center;">
                <button class="home-btn" id="home-modal-open-btn" style="display: flex; align-items: center; gap: 4px; padding: 5px 9px; background: linear-gradient(135deg, var(--orange-primary), #ffaa00); border: none; border-radius: 20px; color: #fff; font-weight: bold; font-size: 0.75rem; cursor: pointer; box-shadow: 0 0 10px rgba(255,107,0,0.4);">
                    🏠曲選択
                </button>
                <button class="retry-btn" id="retry-game-btn" style="display: flex; align-items: center; gap: 4px; padding: 5px 9px; background: linear-gradient(135deg, #00e5ff, #0088ff); border: none; border-radius: 20px; color: #fff; font-weight: bold; font-size: 0.75rem; cursor: pointer; box-shadow: 0 0 10px rgba(0,229,255,0.4);">
                    🔄リトライ
                </button>
            </div>
            <div class="header-center" style="display: flex; flex-direction: column; align-items: center;">
                <img src="assets/amu-tune-logo-banner.png" alt="AMU tune" class="header-logo-img">
                <span class="app-version-tag" style="font-size: 0.60rem; color: #00e5ff; font-weight: 700; font-family: var(--font-heading); letter-spacing: 0.5px; margin-top: 1px;">v1.9.5</span>
            </div>
            <div class="header-right">
                <button class="settings-btn" id="settings-toggle-btn">🔔</button>
            </div>
        </header>

        <!-- 2. メインゲームキャンバスエリア (3D / 2D ゲーム画面) -->
        <main class="game-viewport">
            <!-- 🌌 背景ジャケット画像カバー (薄いサイバーオーバーレイ) -->
            <div id="game-bg-cover" class="game-bg-cover"></div>
            <canvas id="game-canvas"></canvas>

            <!-- 3. 上部HUDパネル (曲名 ＆ スコアの2つのみ・横1列配置) -->
            <div class="top-panels-wrapper">
                <!-- ① 左: 楽曲・再生状況カード -->
                <div class="hud-panel top-center-panel" id="song-card-panel">
                    <div class="song-cover-box" id="song-cover-display">🎵</div>
                    <div class="song-info-group">
                        <div class="song-title-scroll">
                            <div class="song-title" id="song-title-display">Suno Sunrise</div>
                        </div>
                        <div class="song-artist" id="song-artist-display">AI Music Experience</div>
                        <div class="song-metrics">
                            <span class="metric-bpm">BPM <span id="bpm-display">128</span></span>
                            <span class="metric-time"><span id="current-time-display">0:02</span> / <span id="total-time-display">0:45</span></span>
                        </div>
                    </div>
                    <!-- 楽曲プログレスバー -->
                    <div class="song-progress-track">
                        <div class="song-progress-fill" id="song-progress-fill"></div>
                    </div>
                </div>

                <!-- ② 右: スコア ＆ 難易度カード -->
                <div class="hud-panel top-right-score-panel">
                    <div class="score-label">SCORE</div>
                    <div class="score-val" id="score-display">000000</div>
                    <div class="diff-badge-active" id="diff-badge-display">NORMAL</div>
                </div>
            </div>

            <div class="combo-container" id="combo-container">
                <div class="combo-num" id="combo-display">0</div>
                <div class="combo-text">COMBO</div>
            </div>

            <!-- 判定エフェクトポップアップ -->
            <div class="judgment-popup" id="judgment-popup">
                <span class="judgment-text" id="judgment-text">PERFECT</span>
            </div>

            <!-- 6. 5-Lane Touch Controls (矢印無しの洗練されたサイバータッチパネル) -->
            <div class="touch-controls-container" id="touch-controls-container">
                <div class="touch-lane-btn" id="btn-lane-0"></div>
                <div class="touch-lane-btn" id="btn-lane-1"></div>
                <div class="touch-lane-btn" id="btn-lane-2"></div>
                <div class="touch-lane-btn" id="btn-lane-3"></div>
                <div class="touch-lane-btn" id="btn-lane-4"></div>
            </div>

            <!-- 7. 最下部ゲージ (HPヘルス & エナジー) -->
            <div class="hud-panel bottom-status-panel">
                <div class="gauge-group hp-gauge-group">
                    <div class="gauge-header">
                        <span class="gauge-title">HP</span>
                        <span class="gauge-val" id="hp-text">100%</span>
                    </div>
                    <div class="gauge-bar-track">
                        <div class="gauge-bar-fill hp-fill" id="hp-bar-fill" style="width: 100%;"></div>
                    </div>
                </div>
                <div class="gauge-group energy-gauge-group">
                    <div class="gauge-header">
                        <span class="gauge-title">ENERGY</span>
                        <span class="gauge-val">40/100</span>
                    </div>
                    <div class="gauge-bar-track">
                        <div class="gauge-bar-fill energy-fill" style="width: 40%;"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 楽曲読み込み / モード選択 モーダル -->
    <div class="modal-overlay active" id="load-modal">
        <div class="modal-card">
            <!-- 🎨 公式 AMU tune 大迫力ロゴバナー ＆ バージョン -->
            <div class="modal-banner-wrapper">
                <img src="assets/amu-tune-logo-banner.png" alt="AMU tune" class="modal-banner-img">
                <span style="font-size: 0.68rem; color: #00e5ff; font-weight: 900; font-family: var(--font-heading); background: rgba(0,229,255,0.12); border: 1px solid rgba(0,229,255,0.4); padding: 2px 12px; border-radius: 12px; letter-spacing: 0.5px; margin-top: 6px;">v1.9.6</span>
            </div>

            <div class="modal-body">
                <!-- 📌 専用ブックマークレットボタン (Suno連携) -->
                <div style="margin-bottom: 12px;">
                    <button class="action-btn" id="copy-bookmarklet-btn" style="width: 100%; padding: 10px 12px; font-size: 0.9rem; font-weight: bold; background: linear-gradient(135deg, var(--orange-primary), #ffaa00); border: none; border-radius: 10px; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 0 15px rgba(255,107,0,0.45); transition: transform 0.15s ease;">
                        <span>📌 専用ブックマークレットを取得</span>
                        <span style="font-size: 0.75rem; font-weight: normal; opacity: 0.9;">(無料・登録不要)</span>
                    </button>
                    <textarea id="bookmarklet-code" readonly style="display: none;"></textarea>
                </div>

                    <!-- 難易度設定 & スタートボタン -->
                    <div class="modal-controls">
                        <div class="diff-selector">
                            <label style="color: var(--text-muted); font-size: 0.8rem;">難易度:</label>
                            <div class="diff-btn-group" style="display: flex; gap: 6px; margin-top: 4px;">
                                <button class="diff-btn" data-diff="EASY">EASY</button>
                                <button class="diff-btn active" data-diff="NORMAL">NORMAL</button>
                                <button class="diff-btn" data-diff="HARD">HARD</button>
                                <button class="diff-btn" data-diff="EXPERT">EXPERT</button>
                            </div>
                        </div>

                        <!-- ゲームルール切替 (通常加点 / ⚠️ 減点サバイバル) -->
                        <div class="mode-selector" style="margin-top: 10px;">
                            <label style="color: var(--text-muted); font-size: 0.8rem;">ゲームルール:</label>
                            <div class="mode-btn-group" style="display: flex; gap: 6px; margin-top: 4px;">
                                <button class="mode-rule-btn active" id="mode-normal-btn" data-mode="normal" style="flex: 1; padding: 7px 4px; font-size: 0.75rem; font-weight: bold; background: rgba(0,229,255,0.2); border: 1px solid #00e5ff; border-radius: 6px; color: #fff; cursor: pointer; transition: all 0.2s ease;">
                                    ✨ 通常 (加点)
                                </button>
                                <button class="mode-rule-btn" id="mode-survival-btn" data-mode="survival" style="flex: 1; padding: 7px 4px; font-size: 0.75rem; font-weight: bold; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #a0a0a0; cursor: pointer; transition: all 0.2s ease;">
                                    ⚠️ 減点 (－サバイバル)
                                </button>
                            </div>
                        </div>

                    <button class="start-btn" id="start-game-btn" style="width: 100%; margin-top: 12px; padding: 13px; font-size: 1.08rem; font-weight: 900; background: linear-gradient(135deg, #00e5ff, #0088ff); border: none; border-radius: 10px; color: #fff; cursor: pointer; box-shadow: 0 0 20px rgba(0,229,255,0.5);">
                        ▶ プレイスタート！
                    </button>

                    <!-- 🌐 WEBサイト埋め込みコードワンタップコピーボタン -->
                    <button class="action-btn embed-btn" id="embed-code-copy-btn" style="width: 100%; margin-top: 10px; padding: 9px; font-size: 0.8rem; font-weight: bold; background: rgba(0, 229, 255, 0.12); border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 8px; color: #00e5ff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
                        🔗 この曲をWEBサイトに埋め込む
                    </button>

                    <div style="text-align: center; margin-top: 10px; font-size: 0.65rem; color: var(--text-muted); font-family: var(--font-heading);">
                        AMU TUNE RHYTHM ENGINE v2.0.1 (Build 2026.08)
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 🍞 ワンタップコピー完了トースト通知 -->
    <div id="toast-notification" class="toast-notification"></div>

    <!-- JSモジュールロード -->
    <script src="js/srtParser.js?v=2.0.0"></script>
    <script src="js/audioAnalyzer.js?v=2.0.0"></script>
    <script src="js/gameEngine.js?v=2.0.0"></script>
    <script src="js/uiManager.js?v=2.0.0"></script>
    <script src="js/bookmarkletHelper.js?v=2.0.0"></script>
    <script src="js/app.js?v=2.0.0"></script>
</body>
</html>
